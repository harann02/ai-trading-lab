name: scan-monitor-deploy
on:
  schedule:
    # OFF-GRID minutes: no two schedules share a minute (when they did, GitHub delivered ONE run and the 21:30 scan was lost) and none is on :00/:15/:30/:45.
    # Scan vs monitor is decided by INTENT in ci_run.py (action=auto -> app/v3/schedule.classify), NOT by which cron string fired: any unattended run after the
    # close (from max(close+30m, 21:30 UTC)) until the next open that finds no EOD scan recorded for that session performs it, idempotently (one scan per session).
    - cron: "41 21 * * 1-5"             # US EOD scan slot: 21:41 UTC = 05:41 MYT Tue-Sat (after the NYSE close in both EDT (20:00 UTC) and EST (21:00 UTC))
    - cron: "4,19,34,49 13-21 * * 1-5"  # monitor: 13:04-21:49 UTC covers the FULL regular session in EDT (13:30-20:00) and EST (14:30-21:00) incl. post-close; tools/gate.py guards it with the NYSE calendar; 21:34/21:49 also back up the scan
    - cron: "13 2 * * 6"                # weekly strategy + evaluation report Sat 10:13 MYT
  repository_dispatch:
    types: [external-cron]              # FREE external backup trigger (docs/EXTERNAL_CRON.md). Recorded as trigger class 'external_scheduler'; NEVER counted as event=schedule
  workflow_dispatch:
    inputs:
      action:
        description: "scan | monitor | control | weekly | export"
        default: "scan"
      settings_json:
        description: 'OWNER CONTROL (optional): JSON settings patch, e.g. {"max_positions": 4}. Validated + audited by the engine. Only users with write access can run this workflow.'
        default: ""
      command_json:
        description: 'OWNER CONTROL (optional): JSON command, e.g. {"type":"decide_migration_proposal","proposal_id":1,"decision":"KEEP"} or {"type":"reactivate_strategy","strategy":"meanrev","confirm":"REACTIVATE meanrev"}'
        default: ""
  push:
    branches: [main]
    paths: ["site_src/**", "export_static.py", "ci_run.py", ".github/workflows/**", "app/**", "tools/**", "tests/**", "requirements.txt", "docs/**"]
# Bursa jobs were REMOVED in v2.0 (US-only). One run at a time: the ledger DB lives on branch `data`. DB-level idempotency keys + writer lease are the second and third lines of defence.
concurrency:
  group: ailab-ledger
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pip install playwright
      - shell: bash
        run: set -o pipefail; python -m pytest -q | tee pytest-ci.txt   # pipefail: a pytest failure FAILS the step (tee would mask it)
      - if: always()
        run: tail -3 pytest-ci.txt >> "$GITHUB_STEP_SUMMARY" || true

  run:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:            # least privilege: only the run job may write
      contents: write       # push branch data / ledger-log
      pages: write
      id-token: write
      models: read
      issues: write         # failure issue
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: dbstore, fetch-depth: 1 }
      - run: mkdir -p dbstore/control
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Decide action
        id: act
        env:
          EVT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          INPUT: ${{ github.event.inputs.action }}
        run: |
          a=export
          if [ "$EVT" = "workflow_dispatch" ]; then a="${INPUT:-scan}"
          elif [ "$EVT" = "schedule" ]; then
            case "$SCHED" in
              "13 2 * * 6") a=weekly;;
              *) a=auto;;            # scan or monitor, decided by intent (ci_run.py / app/v3/schedule.classify)
            esac
          elif [ "$EVT" = "repository_dispatch" ]; then a=auto   # external backup cron: same intent-based path; client_payload is ignored (cannot pick an action)
          fi
          echo "action=$a" >> "$GITHUB_OUTPUT"; echo "action=$a"
      - name: Calendar gate (NYSE/NASDAQ; skips are recorded with a reason)
        id: gate
        env: { AITL_DB: "${{ github.workspace }}/dbstore/ailab.db" }
        run: python tools/gate.py "${{ steps.act.outputs.action }}" "${{ github.event_name }}" dbstore
      - name: Engine + export + VERIFIED compare-and-swap persist (bounded re-run on conflict; never overwrites a newer ledger)
        id: engine
        if: steps.gate.outputs.proceed != 'false'
        env:
          AITL_FAIL_AFTER_PERSIST: "1"
          AITL_INPUT_SETTINGS: ${{ github.event.inputs.settings_json }}
          AITL_INPUT_COMMAND: ${{ github.event.inputs.command_json }}
          AITL_ALLOW_KEYLESS: ${{ vars.AITL_ALLOW_KEYLESS || '1' }}   # key-less Pollinations is probed every run
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/cycle.py "${{ steps.act.outputs.action }}" dbstore site
      - name: Open an issue if the ledger could not be persisted safely
        if: failure() && steps.engine.outputs.persist_failed == 'true'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh issue create --title "Ledger persist FAILED (nothing pushed) - run ${{ github.run_id }}" --body "The engine run could not be persisted safely (conflict/integrity). The remote ledger was NOT overwritten. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Re-run the workflow after checking branch data." || true
      - uses: actions/configure-pages@v5
        if: steps.engine.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.engine.outputs.changed == 'true'
        with: { path: site }
      - id: deploy
        if: steps.engine.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Fail the run if the ENGINE failed (after the failure was persisted + published)
        if: steps.engine.outputs.engine_status == 'failed'
        run: echo "engine run failed; see job_runs / Activity on the dashboard" && exit 1
