name: scan-monitor-deploy
on:
  schedule:
    - cron: "30 21 * * 1-5"       # US scan: 21:30 UTC = 05:30 MYT Tue-Sat (after the NYSE close in both EDT (20:00 UTC) and EST (21:00 UTC))
    - cron: "*/15 13-21 * * 1-5"  # monitor: 13:00-21:59 UTC covers the FULL regular session in EDT (13:30-20:00) and EST (14:30-21:00) incl. post-close; tools/gate.py guards it with the NYSE calendar (holidays, early closes)
    - cron: "0 2 * * 6"           # weekly strategy + evaluation report Sat 10:00 MYT
  workflow_dispatch:
    inputs:
      action:
        description: "scan | monitor | control | weekly | export"
        default: "scan"
      settings_json:
        description: 'OWNER CONTROL (optional): JSON settings patch, e.g. {"max_positions": 4}. Validated + audited by the engine. Only users with write access can run this workflow.'
        default: ""
      command_json:
        description: 'OWNER CONTROL (optional): JSON command, e.g. {"type":"decide_migration_proposal","proposal_id":1,"decision":"KEEP"} or {"type":"reactivate_strategy","strategy":"meanrev","confirm":"REACTIVATE meanrev"}'
        default: ""
  push:
    branches: [main]
    paths: ["site_src/**", "export_static.py", "ci_run.py", ".github/workflows/**", "app/**", "tools/**", "tests/**", "requirements.txt", "docs/**"]
# Bursa jobs were REMOVED in v2.0 (US-only). One run at a time: the ledger DB lives on branch `data`. DB-level idempotency keys + writer lease are the second and third lines of defence.
concurrency:
  group: ailab-ledger
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
  models: read
  actions: write
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pip install playwright
      - run: python -m pytest -q | tee pytest-ci.txt
      - run: tail -3 pytest-ci.txt >> "$GITHUB_STEP_SUMMARY"

  run:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: dbstore, fetch-depth: 1 }
      - run: mkdir -p dbstore/control
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Decide action
        id: act
        env:
          EVT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          INPUT: ${{ github.event.inputs.action }}
        run: |
          a=export
          if [ "$EVT" = "workflow_dispatch" ]; then a="${INPUT:-scan}"
          elif [ "$EVT" = "schedule" ]; then
            case "$SCHED" in
              "30 21 * * 1-5") a=scan;;
              "0 2 * * 6") a=weekly;;
              *) a=monitor;;
            esac
          fi
          echo "action=$a" >> "$GITHUB_OUTPUT"; echo "action=$a"
      - name: Calendar gate (NYSE/NASDAQ; skips are recorded with a reason)
        id: gate
        run: python tools/gate.py "${{ steps.act.outputs.action }}" "${{ github.event_name }}" dbstore
      - name: Run engine (apply owner controls, scan / monitor)
        id: engine
        if: steps.gate.outputs.proceed != 'false'
        env:
          AITL_FAIL_AFTER_PERSIST: "1"
          AITL_INPUT_SETTINGS: ${{ github.event.inputs.settings_json }}
          AITL_INPUT_COMMAND: ${{ github.event.inputs.command_json }}
          AITL_ALLOW_KEYLESS: ${{ vars.AITL_ALLOW_KEYLESS || '1' }}   # key-less Pollinations is probed every run; AI is only marked VERIFIED if the grounded-JSON probe passes
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AITL_DB: ${{ github.workspace }}/dbstore/ailab.db
          AITL_CONTROL_DIR: ${{ github.workspace }}/dbstore/control
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ci_run.py "${{ steps.act.outputs.action }}"
      - name: Export static snapshot
        if: steps.engine.outputs.changed == 'true'
        env:
          AITL_DB: ${{ github.workspace }}/dbstore/ailab.db
          AITL_TRIGGER: ${{ github.event_name }}:${{ steps.act.outputs.action }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python export_static.py site
      - name: Persist ledger DB + control file to branch data (single squashed commit, race-safe)
        if: steps.engine.outputs.changed == 'true'
        run: |
          cd dbstore
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("ailab.db"); c.execute("PRAGMA wal_checkpoint(TRUNCATE)"); c.execute("PRAGMA journal_mode=DELETE"); c.execute("VACUUM"); c.close()
          PY
          rm -f ailab.db-wal ailab.db-shm
          git config user.name "ailab-bot"; git config user.email "ailab-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin data:refs/remotes/origin/data
            HEAD_SHA=$(git rev-parse origin/data)
            # the owner may have written control/commands.json while we ran: the remote copy wins
            mkdir -p control; if git cat-file -e origin/data:control/commands.json 2>/dev/null; then git show origin/data:control/commands.json > control/commands.json; fi
            git checkout -q --orphan tmp-data-$i
            git add -A
            git commit -qm "ledger snapshot ${GITHUB_RUN_ID} ($(date -u +%FT%TZ))"
            if git push -q --force-with-lease=data:$HEAD_SHA origin tmp-data-$i:data; then echo "pushed"; break; fi
            echo "data branch moved during run, retrying ($i)"; git checkout -q --detach origin/data; sleep 3
          done
      - uses: actions/configure-pages@v5
        if: steps.engine.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.engine.outputs.changed == 'true'
        with: { path: site }
      - id: deploy
        if: steps.engine.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Fail the run if the ENGINE failed (after the failure was persisted + published)
        if: steps.engine.outputs.engine_status == 'failed'
        run: echo "engine run failed; see job_runs / Activity on the dashboard" && exit 1
