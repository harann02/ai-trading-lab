name: ci
on:
  push: { branches: [v3-dev] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pip install playwright   # uses the runner's google-chrome (no browser download)
      - shell: bash
        run: set -o pipefail; python -m pytest -q | tee pytest-ci.txt   # pipefail: a pytest failure FAILS the step (tee would mask it)
      - if: always()
        run: tail -3 pytest-ci.txt >> "$GITHUB_STEP_SUMMARY" || true
