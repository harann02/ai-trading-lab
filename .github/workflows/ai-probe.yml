name: ai-probe
on:
  workflow_dispatch:
  push:
    branches: [v3-dev]
    paths: ["tools/ai_probe.py", ".github/workflows/ai-probe.yml"]
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python tools/ai_probe.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
